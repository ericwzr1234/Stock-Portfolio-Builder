# Refresh www/data/tickers.json from the NASDAQ Trader symbol directory.
#
# Weekly is plenty: the file only needs to pick up new listings and delistings. The generator
# validates before it writes and refuses to replace a good index with a truncated one, so a bad
# fetch day leaves the previous file in place rather than emptying the search box.
#
# This also keeps the OTHER scheduled workflow alive: GitHub disables cron workflows after 60 days
# without repo activity, and a weekly commit here is repo activity.

name: ticker-directory

on:
  schedule:
    - cron: "23 8 * * 0"   # Sundays, off the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the directory
        run: python3 tools/build_ticker_directory.py

      - name: Commit only if it actually changed
        run: |
          set -euo pipefail
          if git diff --quiet -- www/data/tickers.json; then
            echo "no listing changes this week"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/data/tickers.json
          git commit -m "Ticker directory: weekly refresh"
          git push
