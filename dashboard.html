<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Portfolio Builder — Project Board</title>
<!-- Data is loaded as a script (sets window.__BOARD) so this page works by double-clicking it
     (file://) with no server. Regenerate docs/board.js from docs/board.json via tools/render_dashboard.py. -->
<script src="docs/board.js"></script>
<style>
  :root{
    --cream:#F7F3EA; --paper:#FFFFFF; --ink:#1E2A2A; --muted:#6B7472;
    --line:#E2DCCE; --line2:#EDE8DB; --teal:#13605C; --chip:#F0EADD;
    --shadow:0 1px 2px rgba(30,42,42,.06),0 6px 16px rgba(30,42,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"Segoe UI",Inter,Roboto,system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.45}
  header.top{padding:16px 22px 10px;border-bottom:1px solid var(--line);background:rgba(247,243,234,.95);
    position:sticky;top:0;z-index:5;backdrop-filter:saturate(140%) blur(6px)}
  h1{margin:0;font-size:18px;font-weight:750;color:var(--teal);letter-spacing:.2px}
  h1 span{color:var(--ink);font-weight:600}
  .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .sub a{color:var(--teal)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:11.5px;color:var(--muted)}
  .legend .ep{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .pipe{margin-top:6px;font-size:11.5px;color:var(--muted)}
  .pipe b{color:var(--ink);font-weight:600}

  .board{display:flex;gap:12px;padding:16px 22px 40px;overflow-x:auto;align-items:flex-start}
  .col{flex:0 0 248px;max-width:248px;background:#FBF8F1;border:1px solid var(--line);border-radius:12px;
    display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
  .col.done{flex-basis:230px;max-width:230px;opacity:.96}
  .col > .chead{padding:10px 12px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#FBF8F1;
    border-top-left-radius:12px;border-top-right-radius:12px}
  .chead .t{font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:space-between}
  .chead .n{background:var(--chip);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600}
  .chead .d{color:var(--muted);font-size:10.5px;margin-top:3px;line-height:1.35}
  .col .cards{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .stage-tint{height:3px;border-radius:3px;margin:8px 12px 0}

  .card{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--teal);
    border-radius:9px;padding:9px 11px;box-shadow:var(--shadow)}
  .card .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--muted);font-weight:600}
  .card .title{font-weight:650;font-size:12.5px;margin:2px 0 4px}
  .card .notes{color:var(--muted);font-size:11px;line-height:1.45}
  ul.notes{margin:4px 0 0;padding-left:15px}
  ul.notes li{margin:0 0 3px}
  .card .meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .epchip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:650;color:#fff;
    border-radius:5px;padding:1px 7px}
  .tag{font-size:9.5px;font-weight:650;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);
    background:var(--chip);border-radius:4px;padding:1px 6px}
  .card a.spec{font-size:10.5px;color:var(--teal);text-decoration:none}
  .card a.spec:hover{text-decoration:underline}
  .col.done .card{border-left-color:#9bb0a8;box-shadow:none}
  .col.done .card .title{font-weight:600}
  .epic-group{border:1px solid var(--line2);border-radius:9px;margin-bottom:8px;background:#FCFAF4}
  .epic-group>summary{list-style:none;cursor:pointer;padding:8px 10px;display:flex;align-items:center;gap:8px;border-radius:9px;font-size:12px}
  .epic-group>summary::-webkit-details-marker{display:none}
  .epic-group>summary::before{content:"▸";color:var(--muted);font-size:10px}
  .epic-group[open]>summary::before{content:"▾"}
  .epic-group .gname{font-weight:700;color:var(--ink)}
  .epic-group .gcount{margin-left:auto;color:var(--muted);font-size:11px;font-weight:600}
  .epic-group .gcards{padding:0 8px 8px;display:flex;flex-direction:column;gap:8px}
  .empty{color:#b3ab98;font-size:11px;font-style:italic;padding:6px 2px}
  footer{padding:0 22px 30px;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header class="top">
  <h1>◧ Stock Portfolio Builder <span>· Project Board</span></h1>
  <div class="sub" id="sub"></div>
  <div class="legend" id="epicLegend"></div>
  <div class="pipe" id="pipeLegend"></div>
</header>
<div class="board" id="board"></div>
<footer>Single source of truth: <code>docs/board.json</code> → rendered by <code>tools/render_dashboard.py</code> → this page + <code>docs/DASHBOARD.md</code>. Cards move left→right as features progress.</footer>

<script>
"use strict";
(function(){
  const B = window.__BOARD;
  const board = document.getElementById('board');
  if(!B){ board.innerHTML = '<div class="empty" style="padding:22px">Could not load docs/board.js — run <code>tools/render_dashboard.py</code>.</div>'; return; }
  const epics = {}; B.epics.forEach(e=>epics[e.key]=e);
  const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const renderNotes = n => !n ? '' : (Array.isArray(n)
    ? '<ul class="notes">'+n.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'
    : `<div class="notes">${esc(n)}</div>`);

  document.getElementById('sub').innerHTML =
    `Updated ${esc(B.updated||'')} · monitor here or in <a href="docs/DASHBOARD.md">DASHBOARD.md</a> on GitHub. Edit <code>docs/board.json</code> to manage.`;
  document.getElementById('epicLegend').innerHTML = B.epics.map(e=>
    `<span class="ep"><span class="dot" style="background:${e.color}"></span>${esc(e.name)}</span>`).join('');
  document.getElementById('pipeLegend').innerHTML =
    '<b>Pipeline:</b> ' + B.stages.map(s=>esc(s.label)).join(' → ');

  // gentle tint from grey (ideation) → teal (done) across the stages
  const tint = (i,n)=>{ const t=n>1?i/(n-1):1; const lerp=(a,b)=>Math.round(a+(b-a)*t);
    return `rgb(${lerp(150,19)},${lerp(150,96)},${lerp(142,92)})`; };
  const byStage = {}; B.stages.forEach(s=>byStage[s.key]=[]);
  B.items.forEach(it=>{ (byStage[it.stage]=byStage[it.stage]||[]).push(it); });

  function cardHtml(it){
    const ep = epics[it.epic]||{name:it.epic,color:'#888'};
    const tags = [];
    if(it.depends) tags.push(`<span class="tag">⇠ ${esc(it.depends)}</span>`);
    if(it.platform) tags.push(`<span class="tag">${esc(it.platform)}</span>`);
    const spec = it.spec ? `<a class="spec" href="${esc(it.spec)}">spec ↗</a>` : '';
    return `<div class="card" style="border-left-color:${ep.color}">
      <div class="id">${esc(it.id)}</div>
      <div class="title">${esc(it.title)}</div>
      ${renderNotes(it.notes)}
      <div class="meta"><span class="epchip" style="background:${ep.color}">${esc(ep.name.split('·').pop().trim())}</span>${tags.join('')}${spec}</div>
    </div>`;
  }
  board.innerHTML = B.stages.map((s,i)=>{
    const its = byStage[s.key]||[];
    let cards;
    if(s.key==='done' && its.length){
      // group completed cards by epic into collapsible groups so the Done column stays compact
      const byEpic={}; its.forEach(it=>{ (byEpic[it.epic]=byEpic[it.epic]||[]).push(it); });
      cards = B.epics.filter(e=>byEpic[e.key]&&byEpic[e.key].length).map(e=>{
        const grp=byEpic[e.key];
        return `<details class="epic-group"><summary style="border-left:3px solid ${e.color}">
          <span class="gname">${esc(e.name.split('·').pop().trim())}</span>
          <span class="gcount">${grp.length} done</span></summary>
          <div class="gcards">${grp.map(cardHtml).join('')}</div></details>`;
      }).join('');
    } else {
      cards = its.length ? its.map(cardHtml).join('') : '<div class="empty">— empty —</div>';
    }
    return `<div class="col ${s.key==='done'?'done':''}">
      <div class="chead"><div class="t"><span>${esc(s.label)}</span><span class="n">${its.length}</span></div>
        <div class="d">${esc(s.desc)}</div></div>
      <div class="stage-tint" style="background:${tint(i,B.stages.length)}"></div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join('');
})();
</script>
</body>
</html>
